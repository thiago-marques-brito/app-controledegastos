<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>controle finaceiro</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div div id="marca">
        <img src="img/LogoJulius.png" alt="julius">
        <span>Julius</span>
    </div>

   <div id="header"> 
    <span id="boasVindas">Olá!</span>
    <span id="slogan">Vamos te ajudar a melhorar sua vida financeira! </span>
   </div> 
   
   <div id="container">

    <div id="esquerda">
        <span id="lancamentos">Seus lançamentos</span>
        <button id="novoLancamento">Novo Lançamento</button>

        <div id="areaLancamentos">

            <div class="blocoLancamento">
                <img src="img/menos.png" alt="Gasto">
                <div class="descricaoLancamento">
                    <span class="valor gasto">R$ 35,97</span>
                    <span>25/02/26</span>
                    <span>Padaria</span>
                </div>
            </div>

            <div class="blocoLancamento">
                <img src="img/menos.png" alt="Gasto">
                <div class="descricaoLancamento">
                    <span class="valor gasto">R$ 16,50</span>
                    <span>26/02/26</span>
                    <span>Conveniencia</span>
                </div>
            </div>

            <div class="blocoLancamento">
                <img src="img/mais.png" alt="Entrada">
                <div class="descricaoLancamento">
                    <span class="valor entrada">R$ 50,00</span>
                    <span>25/02/26</span>
                    <span>Venda de objeto</span>
                </div>
            </div>

        </div>
    </div>

    <div id="direita">
        <span id="labelRenda">Sua renda mensal</span>
        <img src="img/editar.png" alt="Alterar a renda mensal">
        <span id="renda">R$ 3.000,00</span>
    </div>

</div>

   
</body>
</html>
