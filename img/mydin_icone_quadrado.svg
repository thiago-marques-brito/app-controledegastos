<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAC775"/>
      <stop offset="100%" stop-color="#BA7517"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="#1a2e1a"/>

  <!-- My -->
  <text
    x="256"
    y="210"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="160"
    font-weight="700"
    fill="#f0fce8"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-4">My</text>

  <!-- Din -->
  <text
    x="256"
    y="360"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="160"
    font-weight="700"
    fill="#97C459"
    text-anchor="middle"
    dominant-baseline="central"
    letter-spacing="-4">Din</text>

  <!-- Coin -->
  <circle cx="412" cy="112" r="44" fill="url(#coinGrad)"/>
  <text x="412" y="112" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#412402" text-anchor="middle" dominant-baseline="central">$</text>
</svg>
